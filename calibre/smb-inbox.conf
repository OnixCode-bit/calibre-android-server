# Compartilhamento SMB da inbox do Calibre.
# Acrescente ao fim de /etc/samba/smb.conf (passo 8 do README).
# Troque "usuario" pelo seu usuario do Debian (3 lugares).
# No Windows, a pasta aparece como \\IP_DO_CELULAR\livros

[livros]
   comment = Inbox do Calibre (livros copiados aqui entram na biblioteca)
   path = /home/usuario/calibre/inbox
   browseable = yes
   read only = no
   guest ok = no
   valid users = usuario
   force user = usuario
   create mask = 0644
   directory mask = 0755
   veto files = /.*/
   delete veto files = yes
